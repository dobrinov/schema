[package]
name = "schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Visualise Postgres, MySQL and SQLite schemas and their git diffs in the browser"
build = "build.rs"

[[bin]]
name = "schema"
path = "src/main.rs"

[dependencies]
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
schema-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
